<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>მიღების პორტალი</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy sidebar + working surface. Every list the school edits (programmes, stages, colours, documents, templates) lives in one state object; every label has a Georgian and an English form. */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --surface2: #F7F8FB; --line: #E1E6EF; --line2: #EDF0F5;
  --ink: #152038; --muted: #59657F; --soft: #8892A8;
  --nav: #14213D; --nav-ink: #C3CCE0; --nav-dim: #7E8BAA; --nav-hi: rgba(255,255,255,.09);
  --accent: #3358D4; --accent-bg: #E6ECFC; --on-accent: #FFFFFF;
  --ok: #1D8455; --ok-bg: #E1F3E9; --warn: #9C6208; --warn-bg: #FCEFD4; --bad: #C23A3A; --bad-bg: #FBE5E5;
  --pink: #B8336F; --pink-bg: #FBE3EF; --sky: #1E6FAD; --sky-bg: #E0EEF9; --violet: #6F4CC4; --violet-bg: #EEE8FA;
  --grey: #636D84; --grey-bg: #ECEFF4;
  --hl: rgba(51, 88, 212, .18); --hl-line: #3358D4;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 8px 24px rgba(20,33,61,.08);
  --font: 'Noto Sans Georgian', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1524; --surface: #161F33; --surface2: #1B253C; --line: #29344F; --line2: #222C44;
  --ink: #E5EAF4; --muted: #A2ADC5; --soft: #7D89A4;
  --nav: #0A101D; --nav-ink: #C3CCE0; --nav-dim: #6E7A98; --nav-hi: rgba(255,255,255,.07);
  --accent: #7393F2; --accent-bg: #223159; --on-accent: #0E1524;
  --ok: #55C48F; --ok-bg: #163527; --warn: #E3AA4E; --warn-bg: #3A2B11; --bad: #F07575; --bad-bg: #3C1B20;
  --pink: #F07FB4; --pink-bg: #3E1B2E; --sky: #6DB3EA; --sky-bg: #142F48; --violet: #AA90F2; --violet-bg: #2A2247;
  --grey: #9AA4BA; --grey-bg: #232C42;
  --hl: rgba(115,147,242,.25); --hl-line: #7393F2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1524; --surface: #161F33; --surface2: #1B253C; --line: #29344F; --line2: #222C44;
  --ink: #E5EAF4; --muted: #A2ADC5; --soft: #7D89A4;
  --nav: #0A101D; --nav-ink: #C3CCE0; --nav-dim: #6E7A98; --nav-hi: rgba(255,255,255,.07);
  --accent: #7393F2; --accent-bg: #223159; --on-accent: #0E1524;
  --ok: #55C48F; --ok-bg: #163527; --warn: #E3AA4E; --warn-bg: #3A2B11; --bad: #F07575; --bad-bg: #3C1B20;
  --pink: #F07FB4; --pink-bg: #3E1B2E; --sky: #6DB3EA; --sky-bg: #142F48; --violet: #AA90F2; --violet-bg: #2A2247;
  --grey: #9AA4BA; --grey-bg: #232C42;
  --hl: rgba(115,147,242,.25); --hl-line: #7393F2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.soft { color: var(--soft); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
svg.i { width: 18px; height: 18px; flex: none; }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--nav); color: var(--nav-ink); padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 3px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 8px 18px; color: #fff; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: #3358D4; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; flex: none; }
.brand b { display: block; font-size: 15px; }
.brand small { display: block; color: var(--nav-dim); font-size: 12px; }
.navs { display: flex; flex-direction: column; gap: 3px; }
.nav { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; border: 0; background: none; color: var(--nav-ink); text-align: left; width: 100%; font-size: 13.5px; white-space: nowrap; }
.nav:hover { background: var(--nav-hi); }
.nav[aria-current="page"] { background: var(--nav-hi); color: #fff; font-weight: 600; }
.nav .ct { margin-left: auto; font-size: 11.5px; padding: 0 7px; border-radius: 10px; background: rgba(255,255,255,.12); }
.nav .lk { margin-left: auto; opacity: .6; }
.sec { font-size: 11.5px; color: var(--nav-dim); padding: 14px 12px 6px; }
.me { margin-top: auto; border: 0; text-align: left; color: inherit; display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; background: var(--nav-hi); width: 100%; }
.me b { color: #fff; font-size: 13px; display: block; }
.me span { font-size: 12px; color: var(--nav-dim); }
.me .chev { margin-left: auto; color: var(--nav-dim); }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 12px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.search { flex: 1; min-width: 200px; max-width: 400px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 0 12px; }
.search input { border: 0; background: none; outline: none; padding: 9px 0; width: 100%; min-width: 0; }
.search svg { width: 16px; height: 16px; color: var(--soft); flex: none; }
.yearsel { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 0 4px 0 10px; background: var(--surface); }
.yearsel select { border: 0; background: none; padding: 8px 4px; font-weight: 600; }
.rolechip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; border: 0; }
.prefs { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg2 button { border: 0; background: none; padding: 6px 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); display: grid; place-items: center; min-width: 34px; }
.seg2 button + button { border-left: 1px solid var(--line); }
.seg2 button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.seg2 svg { width: 16px; height: 16px; }
.demo-tag { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
.content { padding-block: 24px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13.5px; white-space: nowrap; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--soft); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn svg { width: 16px; height: 16px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; color: var(--muted); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.icon-btn svg { width: 16px; height: 16px; }

.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: 24px; font-weight: 700; }
.head p { margin: 4px 0 0; color: var(--muted); }
.head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; background: var(--cb); color: var(--c); font-size: 13px; }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner b { display: block; }
.banner span { color: var(--ink); opacity: .85; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.kpi small { color: var(--muted); font-size: 12.5px; }
.kpi b { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi i { font-style: normal; font-size: 12px; font-weight: 600; }

.legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 5px 12px; font-size: 12.5px; color: var(--muted); }
.chip .sw { width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
.chip b { color: var(--ink); font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; font-size: 13px; max-width: 220px; }
.filters select.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.filters .spacer, .legend .spacer { flex: 1; }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--nav); color: #fff; border-radius: 12px; padding: 10px 14px; }
.bulk b { margin-right: 6px; }
.bulk .btn, .bulk select { background: rgba(255,255,255,.1); border: 1px solid transparent; color: #fff; }
.bulk select { border-radius: 9px; padding: 6px 10px; font-size: 12.5px; }
.bulk select option { color: #152038; }
.bulk .x { margin-left: auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.pad { padding: 18px; }
.card h2.t { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card h2.t .s { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--soft); }
.tablewrap { overflow-x: auto; border-radius: 14px; }
table { width: 100%; border-collapse: collapse; }
table.list { min-width: 980px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--soft); padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--surface2); white-space: nowrap; }
th .sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
th .sort svg { width: 14px; height: 14px; opacity: .35; }
th[aria-sort] .sort { color: var(--ink); }
th[aria-sort] .sort svg { opacity: 1; color: var(--accent); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.cbx, td.cbx { width: 44px; padding-right: 0; }
.cbx input { width: 16px; height: 16px; accent-color: var(--accent); }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover td { filter: brightness(.985); }
tr.tinted td { background: var(--tint); }
tr.tinted td:first-child { box-shadow: inset 4px 0 0 var(--stripe); }
tr.sel td { background: var(--accent-bg); }
tr.fresh td { animation: fresh 2.4s ease-out; }
@keyframes fresh { 0%, 40% { background: var(--accent-bg); } }
.who { display: flex; align-items: center; gap: 10px; }
.who b { font-weight: 600; display: block; }
.who small { color: var(--soft); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--c); background: var(--cb); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--grey-bg); color: var(--grey); white-space: nowrap; }
.otag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--c); }
.otag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.fee { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.fee svg { width: 15px; height: 15px; }
.fee.unpaid { color: var(--warn); background: var(--warn-bg); padding: 3px 9px; border-radius: 7px; }
.fee.paid { color: var(--ok); }
.school { max-width: 240px; white-space: normal; }
.empty-row td { text-align: center; color: var(--muted); padding: 40px; }
.locked { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--soft); }
.locked svg { width: 14px; height: 14px; }
.cmt-badge { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.cmt-badge svg { width: 14px; height: 14px; }

.dgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 160px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13px; width: 100%; }
button.bar { border: 0; background: none; padding: 0; text-align: left; }
.bar .tr { height: 12px; border-radius: 6px; background: var(--line2); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 6px; background: var(--c); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.todo { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line2); font-size: 13.5px; }
.todo:last-child { border: 0; }
.todo .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--cb); color: var(--c); flex: none; }
.todo .dot svg { width: 16px; height: 16px; }
.todo small { display: block; color: var(--muted); font-size: 12.5px; }
.todo > .btn, .todo > .switch { margin-left: auto; }
.feed { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.feed > div { display: flex; gap: 10px; }
.feed i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
.feed small { display: block; color: var(--soft); }

.pop { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; width: min(340px, calc(100vw - 32px)); }
.pop h3 { font-size: 14px; margin-bottom: 4px; }
.pop p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
.rolerow { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 8px; border-radius: 9px; text-align: left; }
.rolerow:hover, .rolerow[aria-pressed="true"] { background: var(--accent-bg); }
.rolerow small { display: block; color: var(--muted); font-size: 12px; }
.colrow { display: flex; gap: 10px; align-items: center; padding: 7px 2px; font-size: 13.5px; }
.colrow input { width: 16px; height: 16px; accent-color: var(--accent); }
.scrim { position: fixed; inset: 0; background: rgba(10,16,29,.42); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { display: flex; gap: 12px; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer header h2 { font-size: 18px; }
.drawer .body { overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.modal h2 { font-size: 18px; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.drawer h3, .lbl3 { font-size: 13px; color: var(--soft); font-weight: 600; }
.tl { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.tl > div { display: flex; gap: 10px; }
.tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
.tl small { display: block; color: var(--soft); }
.cmts { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.cmt { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.cmt small { display: block; color: var(--soft); font-size: 12px; margin-bottom: 2px; }
.cmt-new { display: flex; gap: 8px; align-items: flex-end; }
.cmt-new textarea { flex: 1; min-height: 60px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface); }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

.frm { display: flex; flex-direction: column; gap: 12px; }
.frm label { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
.inp, .frm input, .frm select, .frm textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; min-width: 0; }
.frm textarea { min-height: 190px; resize: vertical; line-height: 1.6; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { flex-direction: row !important; align-items: center; gap: 9px !important; color: var(--ink) !important; font-size: 13.5px !important; }
.switch { position: relative; width: 36px; height: 21px; border-radius: 11px; background: var(--line); border: 0; padding: 0; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(15px); }
.switch:disabled { opacity: .5; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; }
.swatches button { width: 22px; height: 22px; border-radius: 6px; border: 2px solid transparent; background: var(--c); padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.ledit td { padding: 8px 12px; }
.ledit input.inp { width: 100%; }
.ledit .ord { display: flex; gap: 4px; }
.ledit .num { width: 90px; }

.ygrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ycard { padding: 18px; display: flex; flex-direction: column; gap: 12px; }

  function mailRecipients() {

      if (MAIL.ids) return MAIL.ids.indexOf(r.id) >= 0;

    var fee = find('programs', d.prog).fee;

      '<div class="dq"><div class="ql">' + t('წინა სკოლის ტიპი', 'Previous school type') + '<small>' + t('ადამიანი ადასტურებს', 'A person confirms this') + '</small></div><div><div class="hint" style="margin:0 0 8px;color:var(--ink)">' + esc(v['app.prevSchool'] || t('წინა სკოლა მითითებული არ არის', 'No previous school given')) + '</div><div class="seg" id="origin">' +

      '</div><div class="hint">' + esc(tx(d.reason)) + (d.suggestion === 'foreign' || d.origin === 'foreign' ? t(' · უცხოური სკოლიდან საჭიროა დოკუმენტების თარგმანი და აღიარება', ' · a school abroad needs translated documents and recognition') : '') + '</div></div></div>' +
      '<div class="dq"><label for="dProg">' + t('პროგრამა და კლასი', 'Programme and grade') + '</label><div><div class="row2"><select class="inp" id="dProg">' + L('programs').map(function (p) { return '<option value="' + p.id + '"' + (p.id === d.prog ? ' selected' : '') + '>' + esc(nm(p)) + '</option>'; }).join('') + '</select>' +

      '<div class="dq"><div class="ql">' + t('რეგისტრაციის გადასახადი', 'Registration fee') + '</div><div><div class="seg" id="paid"><button data-p="0" aria-pressed="' + !d.paid + '" style="--c:var(--warn)"><span class="sw"></span>' + t('გადაუხდელი', 'Unpaid') + '</button><button data-p="1" aria-pressed="' + d.paid + '" style="--c:var(--ok)"><span class="sw"></span>' + t('გადახდილი', 'Paid') + '</button></div>' +
      '<div class="hint">' + t('თანხა პროგრამის მიხედვით: ', 'Amount for this programme: ') + '<b>' + (fee ? fee + ' €' : '—') + '</b>' + t(' · საბოლოოდ ბუღალტერია ადასტურებს', ' · accounting gives the final confirmation') + '</div></div></div></div>';

        var edited = s.orig[f.key] !== undefined && val !== s.orig[f.key];

          '<div class="fwrap"><input id="' + id + '" data-k="' + f.key + '" value="' + esc(masked ? maskPid(val) : val) + '"' + (masked ? ' disabled' : '') + ' placeholder="' + (r[0] === 'empty' ? t('PDF-ში ცარიელია', 'Empty in the PDF') : '') + '"><span class="st" aria-hidden="true">' + mark + '</span></div>' +
          (r[1] ? '<div class="msg">' + esc(r[1]) + '</div>' : '') + '</div>';
      }).join('');
      return '<section class="card sect"><header><h3>' + tx(sec.title) + '</h3><span class="s">' + ok + ' / ' + all + t(' შევსებული და სწორი', ' filled and valid') + '</span></header><div class="fgrid">' + body + '</div></section>';
    }).join('');
    var docs = '<section class="card sect"><header><h3>' + t('დოკუმენტები', 'Documents') + '</h3><span class="s">' + t('სია იმართება „სიები და პარამეტრებიდან“', 'Managed under “Lists and settings”') + '</span></header><div>' +
      L('docs').map(function (dk) {
        var key = DOC_KEYS[dk.id], val = key ? v[key] : '';
        var right = key ? (val ? esc(val) + t(' · OpenApply-ში', ' · in OpenApply') : (dk.required ? '<span style="color:var(--bad);font-weight:600">' + t('აკლია, მოითხოვეთ მშობლისგან', 'Missing, ask the parent') + '</span>' : t('არ ატვირთულა (არასავალდებულო)', 'Not uploaded (optional)'))) : t('მოაქვს ადგილზე', 'Brought in person');
        return '<div class="doc"' + (key ? ' data-k="' + key + '"' : '') + '><span class="ico ' + (val ? 'y">✓' : key && dk.required ? 'n">!' : 'l">–') + '</span>' + esc(nm(dk)) + '<span class="f">' + right + '</span></div>';
      }).join('') + '</div></section>';
    var ready = !!d.origin && s.reviewed;
    var why = !d.origin ? t('აირჩიეთ წინა სკოლის ტიპი', 'Choose the previous school type') : !s.reviewed ? t('მონიშნეთ, რომ მონაცემები გადაამოწმეთ', 'Tick that you have reviewed the data') : t('ყველაფერი მზადაა', 'Ready');

      '<div class="card viewer" id="viewer"><div class="vbar">' + ICON.file + '<b>' + esc(s.name) + '</b><span style="margin-left:auto">' + s.pages.length + t(' გვ. · დააჭირეთ ველს და PDF-ში მოინიშნება', ' pp. · click a field to highlight it in the PDF') + '</span></div><div class="pages" id="pages"></div></div>' +
      '<div class="rv"><div class="card idcard"><div class="av">' + initials(fullName) + '</div><div><h2>' + esc(fullName || t('უსახელო განაცხადი', 'Untitled application')) + '</h2><div class="meta"><span class="mono">OpenApply ' + esc(m.applicantId || '—') + '</span><span>·</span><span>' + esc(m.formTitle || t('OpenApply განაცხადი', 'OpenApply application')) + '</span>' + oaChip + '</div></div>' +
      '<div class="counts"><span class="count" style="--c:var(--ok);--cb:var(--ok-bg)">' + c.ok + t(' ამოცნობილი', ' recognised') + '</span><span class="count" style="--c:var(--warn);--cb:var(--warn-bg)">' + c.warn + t(' შესამოწმებელი', ' to check') + '</span><span class="count" style="--c:var(--grey);--cb:var(--grey-bg)">' + c.empty + t(' ცარიელი', ' empty') + '</span></div>' +
      '<button class="btn toggle-pdf" id="togglePdf">' + ICON.file + t('PDF-ის ნახვა', 'Show PDF') + '</button></div>' +
      (!oaOk ? '<div class="banner" style="--c:var(--warn);--cb:var(--warn-bg)">' + ICON.info + '<div><b>' + t('OpenApply-ში ეს განაცხადი „' + oaStatus(m.status) + '“ სტატუსითაა', 'In OpenApply this application is “' + oaStatus(m.status) + '”') + '</b><span>' + t('სისტემა სტატუსს PDF-ის თავიდან კითხულობს, რომ შემთხვევით არ დაემატოს ის, ვინც უკვე აღარ მოდის.', 'The system reads the status from the top of the PDF, so that nobody who is no longer coming gets added by mistake.') + '</span></div></div>' : '') +
      banners + decide + sections + docs +
      '<div class="card confirm"><label><input type="checkbox" id="reviewed"' + (s.reviewed ? ' checked' : '') + '> ' + t('მონიშნული ველები გადავამოწმე', 'I reviewed the flagged fields') + '</label><span class="why">' + esc(why) + '</span>' +
      '<div class="acts"><button class="btn ghost" id="cancel">' + t('გაუქმება', 'Cancel') + '</button><button class="btn pri" id="confirm"' + (ready ? '' : ' disabled') + '>' + ICON.check + t('დადასტურება და დამატება', 'Confirm and add') + '</button></div></div></div></div>';

  function renderPages() {
    var s = session, host = $('#pages'); if (!host) return;
    if (s.pageEls) { s.pageEls.forEach(function (pe) { host.appendChild(pe.wrap); }); host.scrollTop = s.pagesTop || 0; return; }
    var width = Math.min(host.clientWidth - 28, 760); if (width < 200) width = 520;
    s.pageEls = [];
    s.pages.forEach(function (pg, i) {
      var wrap = document.createElement('div'); wrap.className = 'pg'; wrap.style.width = width + 'px';
      var canvas = document.createElement('canvas'), scale = width / pg.width, dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = pg.page.getViewport({ scale: scale * dpr }); canvas.width = vp.width; canvas.height = vp.height; canvas.setAttribute('aria-label', t('გვერდი ', 'Page ') + (i + 1));
      wrap.appendChild(canvas); host.appendChild(wrap); s.pageEls.push({ wrap: wrap, scale: scale });
      pg.page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
    });
  }
  function highlight(key) {
    var s = session; if (!s || !s.pageEls) return;
    $$('.mark-box').forEach(function (b) { b.remove(); });
    var f = s.parsed.fields[key], b = f && (f.box || f.labelBox); if (!b) return;
    var pe = s.pageEls[b.page]; if (!pe) return;
    var lb = f.labelBox && f.labelBox.page === b.page ? f.labelBox : b;
    var x0 = Math.min(lb.x, b.x) - 4, y0 = Math.min(lb.y, b.y) - 3, x1 = Math.max(lb.x + lb.w, b.x + b.w) + 4, y1 = Math.max(lb.y + lb.h, b.y + b.h) + 3;
    var box = document.createElement('div'); box.className = 'mark-box';
    box.style.left = x0 * pe.scale + 'px'; box.style.top = y0 * pe.scale + 'px'; box.style.width = (x1 - x0) * pe.scale + 'px'; box.style.height = (y1 - y0) * pe.scale + 'px';
    pe.wrap.appendChild(box);
    var host = $('#pages'); host.scrollTo({ top: Math.max(0, pe.wrap.offsetTop + y0 * pe.scale - host.clientHeight / 3), behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  function wireReview() {
    var s = session;
    var keep = function () { var h = $('#pages'); if (h) s.pagesTop = h.scrollTop; var y = window.scrollY; renderReview(); window.scrollTo(0, y); };
    $('#origin').addEventListener('click', function (e) { var b = e.target.closest('[data-o]'); if (!b) return; s.decision.origin = b.dataset.o; keep(); });
    $('#paid').addEventListener('click', function (e) { var b = e.target.closest('[data-p]'); if (!b) return; s.decision.paid = b.dataset.p === '1'; keep(); });
    $('#dProg').addEventListener('change', function (e) { s.decision.prog = e.target.value; if (gradeOptions(s.decision.prog).indexOf(s.decision.grade) < 0) s.decision.grade = ''; keep(); });
    $('#dGrade').addEventListener('change', function (e) { s.decision.grade = e.target.value; });
    $('#dLoc').addEventListener('change', function (e) { s.decision.location = e.target.value; });
    $('#reviewed').addEventListener('change', function (e) { s.reviewed = e.target.checked; keep(); });
    $('#cancel').addEventListener('click', function () { session = null; renderImportStart(); window.scrollTo(0, 0); });
    $('#confirm').addEventListener('click', confirmImport);
    $('#togglePdf').addEventListener('click', function () { $('#viewer').classList.toggle('show'); });
    var rv = $('.rv');

    rv.addEventListener('click', function (e) { var dd = e.target.closest('.doc[data-k]'); if (dd) highlight(dd.dataset.k); });
    rv.addEventListener('change', function (e) {
      var k = e.target.dataset && e.target.dataset.k; if (!k || e.target.closest('.decide')) return;

    });
  }
  function confirmImport() {
    var s = session, v = s.values, d = s.decision, m = s.parsed.meta;
    var id = 'n' + Date.now(), edits = Object.keys(s.orig).filter(function (k) { return s.values[k] !== s.orig[k]; }).length;
    var docs = {}; Object.keys(DOC_KEYS).forEach(function (k) { if (v[DOC_KEYS[k]]) docs[k] = 1; });
    var cz = v['student.citizenship'] || '—';
    var r = R({ id: id, year: S.year, first: v['student.firstName'] || '—', last: v['student.lastName'] || '', oa: m.applicantId || '—', prog: d.prog, grade: d.grade || '', location: d.location,
      school: v['app.prevSchool'] || '', origin: d.origin, status: 'new', paid: d.paid, received: new Date().toISOString().slice(0, 10),

    go('list');
    toast(t('დაემატა სიაში: ', 'Added to the list: ') + r.first + ' ' + r.last);
  }

  render();
  window.addEventListener('resize', function () {
    if (session && session.pageEls && $('#pages') && Math.abs(($('#pages').clientWidth - 28) - parseFloat(session.pageEls[0].wrap.style.width)) > 80) { session.pageEls = null; $('#pages').innerHTML = ''; renderPages(); }
  });
